<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Randers GeoJSON</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Opret kort
    var map = L.map("map").setView([56.46, 10.05], 11);

    // Baggrundskort
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap-bidragydere'
    }).addTo(map);

    // Indlæs GeoJSON med fetch
    fetch("data/RandersFjord5.geojson")
      .then(response => response.json())
      .then(data => {
        var randersLayer = L.geoJSON(data, {
          style: function (feature) {
            if (feature.properties && feature.properties.status === "Aktivt") {
              return { color: "red", weight: 2, fillOpacity: 0.3 };
            } else {
              return { color: "green", weight: 2, fillOpacity: 0.3 };
            }
          },
          onEachFeature: function (feature, layer) {
            var att = feature.properties || {};

            // Popup med tabel
            var popupContent =
              "<div style='min-width:220px;'>" +
                "<h4 style='text-align:center; margin:0 0 5px 0;'><strong>Pumpelag</strong></h4>" +
                "<table style='width:100%; border-collapse:collapse;'>" +
                  "<tr><td><strong>Navn:</strong></td><td>" + (att.navn || "Ukendt") + "</td></tr>" +
                  "<tr><td><strong>Areal:</strong></td><td>" + (att.Areal || "?") + " ha</td></tr>" +
                  "<tr><td><strong>Status:</strong></td><td>" + (att.status || "Ingen data") + "</td></tr>" +
                  "<tr><td><strong>Læs mere:</strong></td><td>" +
                    "<a href='" + (att.Forklaring || "#") + "' target='_blank'>" +
                      (att.navn || "Link") +
                    "</a></td></tr>" +
                "</table>" +
              "</div>";

            layer.bindPopup(popupContent);
          }
        }).addTo(map);

        // Zoom til laget
        map.fitBounds(randersLayer.getBounds());
      });
  </script>
</body>
</html>
