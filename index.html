<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Randers GeoJSON</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Opret kort
    var map = L.map("map").setView([56.46, 10.05], 11);

    // Baggrundskort
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap-bidragydere'
    }).addTo(map);

    // Indlæs GeoJSON med fetch
    fetch("data/RandersFjord5.geojson")
      .then(response => response.json())
      .then(data => {
        var randersLayer = L.geoJSON(data, {
          style: function (feature) {
            if (feature.properties && feature.properties.status === "Aktivt") {
              return { color: "green", weight: 2, fillOpacity: 0.3 };
            } else {
              return { color: "red", weight: 2, fillOpacity: 0.3 };
            }
          },
          onEachFeature: function (feature, layer) {
            var props = feature.properties || {};
            var txt = "<b>Randers5</b>";
            txt += "<br>Status: " + (props.status || "ukendt");
            layer.bindPopup(txt);
          }
        }).addTo(map);

        // Zoom til laget
        map.fitBounds(randersLayer.getBounds());
      });
  </script>
</body>
</html>
